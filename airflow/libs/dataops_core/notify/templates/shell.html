<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{subject}</title>
</head>
<body style="margin:0;padding:0;background:#f6f8fb;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0f1923;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f8fb;padding:28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #d4dce5;border-radius:10px;overflow:hidden;">
          <tr>
            <td style="padding:0;line-height:0;font-size:0;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td width="25%" style="height:4px;background:#29A44B;">&nbsp;</td>
                  <td width="25%" style="height:4px;background:#F5A020;">&nbsp;</td>
                  <td width="25%" style="height:4px;background:#2652D0;">&nbsp;</td>
                  <td width="25%" style="height:4px;background:#D83E3E;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 28px 0 28px;">
              {logo_html}
              <div style="margin-top:14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#607085;font-weight:700;">
                {eyebrow}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 0 28px;">
              <h1 style="margin:0;font-size:20px;line-height:1.35;font-weight:700;color:#122370;letter-spacing:-.02em;">
                {headline}
              </h1>
              <p style="margin:8px 0 0 0;font-size:14px;line-height:1.5;color:#607085;">
                {context_line}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px 0 28px;">
              {body_html}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 24px 28px;">
              {action_html}
            </td>
          </tr>
          <tr>
            <td style="padding:14px 28px;background:#0f1923;color:#b0bcc8;font-size:11px;line-height:1.5;">
              <strong style="color:#dce6fb;">{brand_name}</strong>
              · {brand_org}<br>
              {copyright_line}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
