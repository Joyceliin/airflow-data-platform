limit_req_zone $binary_remote_addr zone=auth_token_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=health_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=auth_conn_per_ip:10m;
limit_conn_zone $binary_remote_addr zone=health_conn_per_ip:10m;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Origem interna (rede Docker / loopback) — probes e saltos locais.
geo $health_from_internal {
    default          0;
    127.0.0.0/8      1;
    171.50.1.0/24    1;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    proxy_cookie_flags session secure;

    location = /docs {
        return 403;
    }

    location ^~ /docs/ {
        return 403;
    }

    location = /redoc {
        return 403;
    }

    location ^~ /redoc/ {
        return 403;
    }

    location = /openapi.json {
        return 403;
    }

    location = /api/v1/docs {
        return 403;
    }

    location ^~ /api/v1/docs/ {
        return 403;
    }

    location = /api/v1/redoc {
        return 403;
    }

    location ^~ /api/v1/redoc/ {
        return 403;
    }

    location = /api/v1/openapi.json {
        return 403;
    }

    location = /api/v2/docs {
        return 403;
    }

    location ^~ /api/v2/docs/ {
        return 403;
    }

    location = /api/v2/redoc {
        return 403;
    }

    location ^~ /api/v2/redoc/ {
        return 403;
    }

    location = /api/v2/openapi.json {
        return 403;
    }

    # Health: bloqueia scrape anonimo de fora.
    # Libera: rede interna, sessao UI (cookie) ou Authorization.
    # Nginx → airflow: sem limite extra (so proxy_pass).
    # Healthcheck do compose bate no webserver localhost — nao passa aqui.
    location = /health {
        set $health_deny 1;
        if ($health_from_internal = 1) { set $health_deny 0; }
        if ($http_cookie ~* "(session|_session|csrf)") { set $health_deny 0; }
        if ($http_authorization != "") { set $health_deny 0; }
        if ($health_deny = 1) { return 403; }

        limit_req zone=health_per_ip nodelay;
        limit_conn health_conn_per_ip 8;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        proxy_pass http://airflow-webserver:8080;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /api/v1/health {
        set $health_deny 1;
        if ($health_from_internal = 1) { set $health_deny 0; }
        if ($http_cookie ~* "(session|_session|csrf)") { set $health_deny 0; }
        if ($http_authorization != "") { set $health_deny 0; }
        if ($health_deny = 1) { return 403; }

        limit_req zone=health_per_ip nodelay;
        limit_conn health_conn_per_ip 8;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        proxy_pass http://airflow-webserver:8080;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /api/v2/monitor/health {
        set $health_deny 1;
        if ($health_from_internal = 1) { set $health_deny 0; }
        if ($http_cookie ~* "(session|_session|csrf)") { set $health_deny 0; }
        if ($http_authorization != "") { set $health_deny 0; }
        if ($health_deny = 1) { return 403; }

        limit_req zone=health_per_ip nodelay;
        limit_conn health_conn_per_ip 8;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        proxy_pass http://airflow-webserver:8080;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /auth/token {
        limit_req zone=auth_token_per_ip nodelay;
        limit_conn auth_conn_per_ip 2;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Retry-After "60" always;
        proxy_pass http://airflow-webserver:8080;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://airflow-webserver:8080;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
